name: CI

env:
  R2V: 6.2.2

on:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.build_system }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_system:
          - make
          - meson

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install radare2
        uses: radareorg/github-actions@v3
        with:
          version: ${{ env.R2V }}

      - name: Build with Make
        if: matrix.build_system == 'make'
        run: make

      - name: Install Meson
        if: matrix.build_system == 'meson'
        run: python3 -m pip install meson ninja --break-system-packages

      - name: Build with Meson
        if: matrix.build_system == 'meson'
        run: |
          meson setup build-meson
          meson compile -C build-meson

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Meson
        run: python -m pip install meson ninja

      - name: Install radare2
        id: r2
        uses: radareorg/github-actions@v3
        with:
          version: ${{ env.R2V }}

      - name: Configure
        run: meson setup build-windows --buildtype=release

      - name: Build
        run: meson compile -C build-windows

      - name: Package r2pm binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bindist\plugins | Out-Null
          Copy-Item build-windows\core_r2garlic.dll bindist\plugins
          Compress-Archive -Path bindist\plugins -DestinationPath "r2garlic-$env:R2V-windows-x86-64.zip" -Force

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: r2garlic-*-windows-x86-64.zip
          if-no-files-found: error

  bindist:
    name: Build r2pm binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install radare2
        uses: radareorg/github-actions@v3
        with:
          version: ${{ env.R2V }}

      - name: Package r2pm binary
        run: make bindist

      - name: Upload r2pm binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindist-${{ matrix.os }}
          path: r2garlic-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
      - windows
      - bindist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist/artifacts

      - name: Download r2pm binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindist-*
          path: dist/artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/artifacts/*.zip